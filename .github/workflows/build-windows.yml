name: Build Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.1)'
        required: false
        default: 'v1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release files
        run: dir release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: Red Child ${{ github.ref_name || inputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Red Child — Cybersecurity Learning App

            ### Скачать:
            - **Red Child Setup x.x.x.exe** — установщик (рекомендуется)
            - **Red Child x.x.x.exe** — портативная версия (без установки)

            ### Модули:
            - 🔴 Кибербезопасность
            - 🏢 CRM — подготовка к экзамену
            - ⚙️ Моделирование бизнес-процессов (100 вопросов)
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
